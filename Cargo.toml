[package]
name = "duckcm"
version = "2.4.1"
edition = "2021"
description = "DuckCM 2 — 养殖用房屋设备自动化计算系统 (Rust 重写)"
license = "MIT"

[lib]
name = "duckcm_core"
path = "src/core/lib.rs"

[[bin]]
name = "DuckCM"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.31"
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rfd = "0.15"
ureq = "2"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
